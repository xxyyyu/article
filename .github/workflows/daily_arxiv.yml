name: Dynamic Research Tracker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  track_papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install arxiv PyYAML

      - name: Generate Summary
        run: |
          python <<EOF
          import arxiv
          import yaml
          import datetime

          # 1. 加载定制化的配置文件
          with open('config.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          keywords = ' OR '.join([f'"{k}"' for k in config['research_fields']])
          max_res = config.get('max_results', 5)

          # 2. 搜索 arXiv
          search = arxiv.Search(
              query=keywords,
              max_results=max_res,
              sort_by=arxiv.SortCriterion.SubmittedDate
          )

          # 3. 写入 README
          with open("README.md", "a", encoding="utf-8") as f:
              f.write(f"\n\n### 📅 研究周报: {datetime.date.today()}\n")
              f.write(f"> **当前追踪方向**: {', '.join(config['research_fields'])}\n\n")
              for result in search.results():
                  f.write(f"#### [{result.title}]({result.entry_id})\n")
                  f.write(f"- **领域**: {result.primary_category}\n")
                  f.write(f"- **核心摘要**: {result.summary[:300]}...\n\n")
          EOF

      - name: Update Repository
        run: |
          git config --global user.name "Scholar-Bot"
          git config --global user.email "bot@github.com"
          git add README.md
          git commit -m "Auto-update papers for $(date)" || echo "No changes to commit"
          git push
