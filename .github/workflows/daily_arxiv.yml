name: Dynamic Research Tracker with PDF

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  track_papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install arxiv PyYAML

      - name: Generate Summary and Download PDFs
        run: |
          python <<EOF
          import arxiv
          import yaml
          import datetime
          import os
          import re

          # 1. 加载定制化的配置文件
          with open('config.yml', 'r') as f:
              config = yaml.safe_load(f)
          
          keywords = ' OR '.join([f'"{k}"' for k in config['research_fields']])
          max_res = config.get('max_results', 5)

          # 2. 准备 PDF 存储目录 (按日期分类)
          date_str = datetime.date.today().strftime("%Y-%m-%d")
          pdf_path = f"papers/{date_str}"
          if not os.path.exists(pdf_path):
              os.makedirs(pdf_path)

          # 3. 搜索 arXiv
          search = arxiv.Search(
              query=keywords,
              max_results=max_res,
              sort_by=arxiv.SortCriterion.SubmittedDate
          )

          # 4. 写入 README 并下载文件
          with open("README.md", "a", encoding="utf-8") as f:
              f.write(f"\n\n### 📅 研究周报 & 文献下载: {date_str}\n")
              f.write(f"> **追踪方向**: {', '.join(config['research_fields'])}\n\n")
              
              for result in search.results():
                  # 清理文件名中的非法字符
                  clean_title = re.sub(r'[^\w\s-]', '', result.title).replace(' ', '_')[:50]
                  file_name = f"{clean_title}.pdf"
                  
                  # 下载 PDF
                  result.download_pdf(dirpath=pdf_path, filename=file_name)
                  
                  # 写入文档信息和本地链接
                  f.write(f"#### [{result.title}]({result.entry_id})\n")
                  f.write(f"- **📥 本地PDF**: [点击阅读](./{pdf_path}/{file_name})\n")
                  f.write(f"- **领域**: {result.primary_category}\n")
                  f.write(f"- **核心摘要**: {result.summary[:300]}...\n\n")
          EOF

      - name: Update Repository
        run: |
          git config --global user.name "Scholar-Bot"
          git config --global user.email "bot@github.com"
          # 添加 README 和新下载的 PDF 文件夹
          git add README.md papers/
          git commit -m "Auto-update papers and PDFs for $(date)" || echo "No changes to commit"
          git push
